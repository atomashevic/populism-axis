<text x="35" y="1087" class="small" >Each APSI difference uses the same scored subset for both systems; different rows can have different coverage.</text>
<text x="35" y="1107" class="small" >APSI overall populism scores are compared with component labels without selecting hypothesis subsets.</text>
<text x="35" y="1127" class="small" >EU macro-F1 uses matched-sample leave-one-speaker-out thresholds. Its intervals condition on fixed predictions.</text>
<text x="35" y="1147" class="small" >Bootstrap units follow the original evaluation. * Fewer than 90% of requested bootstrap draws were estimable.</text>
<text x="35" y="1167" class="small" >Native APSI truncates each premise–hypothesis pair to the model limit. Base and chunk sensitivities are in the result tables.</text>
