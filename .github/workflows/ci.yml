name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the frozen runtime assets (standard library only)
        run: python3 scripts/verify_frozen_assets.py
      - name: Install the locked CPU environment
        run: uv sync --extra cpu --locked --python 3.12
      - name: Unit tests
        run: uv run --extra cpu python -m unittest discover -s tests
      - name: Compile all modules
        run: uv run --extra cpu python -m compileall -q scripts src tests
      - name: Recompute the benchmark table from committed scores
        run: uv run --extra cpu python scripts/reproduce_table.py
      - name: Check the public release lists
        if: hashFiles('scripts/build_public_tree.py') != ''
        run: python3 scripts/build_public_tree.py --check-lists

  r:
    runs-on: ubuntu-latest
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Prepare the Python backend the R tests run against
        run: uv sync --extra cpu --locked --python 3.12
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/populismaxis
          extra-packages: any::rcmdcheck
      - name: R CMD build and check
        run: |
          R CMD build r/populismaxis
          POPULISM_AXIS_TEST_PYTHON="$PWD/.venv/bin/python" \
          RETICULATE_PYTHON="$PWD/.venv/bin/python" \
          UV_OFFLINE=1 HF_HUB_OFFLINE=1 \
          R CMD check --no-manual populismaxis_*.tar.gz
      - name: Show check log on failure
        if: failure()
        run: cat populismaxis.Rcheck/00check.log populismaxis.Rcheck/tests/testthat.Rout* || true
